name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools Lago uses
        run: |
          brew install tmux
          python -m pip install --quiet playwright
          python -m playwright install webkit
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: The app in Safari's engine (WebKit), with an agent's terminal in the page
        if: success() || failure()
        run: python tests/e2e_app_window.py webkit shots
      - name: The Keychain keeps a secret
        if: success() || failure()
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "lago")
          import vault
          keychain = vault.MacKeychainBackend()
          keychain.store("ci-check", "ci", 'a "quoted" value\\with a backslash')
          assert keychain.lookup("ci-check", "ci") == 'a "quoted" value\\with a backslash', keychain.lookup("ci-check", "ci")
          keychain.clear("ci-check", "ci")
          assert keychain.lookup("ci-check", "ci") is None
          print("Keychain: stored, read back and removed")
          PY
      - name: Lago's voices install from the app and a persona speaks with Kokoro
        if: success() || failure()
        run: |
          export HOME="$RUNNER_TEMP/voice-home" XDG_STATE_HOME="$RUNNER_TEMP/voice-home/state"
          mkdir -p "$HOME"
          python lago/voice_setup.py
          cat "$XDG_STATE_HOME/lago-agents/voice-setup.json"
          "$HOME/.local/share/lago-agents/tts/bin/python" lago/speak.py --voice kokoro:am_santa \
            --out "$RUNNER_TEMP/chip" -- "Hi, I'm Chip."
          ls -l "$RUNNER_TEMP"/chip.*
          test -s "$(ls "$RUNNER_TEMP"/chip.* | head -1)"
          # The women's voice, and Portuguese: Kokoro's (Marina's) and Piper's (Chip's and Atlas's)
          for spoken in "kokoro:bf_isabella|marina|Hi, I'm Marina." "kokoro:pf_dora@pt|marina-pt|Olá, eu sou a Marina." \
                        "piper:pt_BR-cadu-medium|chip-pt|Olá, eu sou o Chip."; do
            IFS='|' read -r who out words <<< "$spoken"
            "$HOME/.local/share/lago-agents/tts/bin/python" lago/speak.py --voice "$who" --out "$RUNNER_TEMP/$out" -- "$words"
            test -s "$(ls "$RUNNER_TEMP/$out".* | head -1)"
          done
      - name: The installer makes the app and its background service
        if: success() || failure()
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\necho "claude (stand-in for the installer check)"\n' > "$RUNNER_TEMP/bin/claude"
          chmod +x "$RUNNER_TEMP/bin/claude"
          PATH="$RUNNER_TEMP/bin:$PATH" ./install.sh
          test -x "$HOME/Applications/Lago Agents.app/Contents/MacOS/lago-agents"
          plutil -lint "$HOME/Applications/Lago Agents.app/Contents/Info.plist"
          plutil -lint "$HOME/Library/LaunchAgents/com.lago-agents.scheduler.plist"
          grep -q "$RUNNER_TEMP/bin" "$HOME/Applications/Lago Agents.app/Contents/MacOS/lago-agents"
          launchctl print "gui/$(id -u)/com.lago-agents.scheduler" | head -5 || echo "(launchd agents may not start on CI machines)"
      - name: The app starts and serves its page
        if: success() || failure()
        run: |
          python lago/app_server.py --no-window > "$RUNNER_TEMP/url.txt" 2> "$RUNNER_TEMP/server.log" &
          for i in $(seq 1 60); do [ -s "$RUNNER_TEMP/url.txt" ] && break; sleep 1; done
          URL=$(head -1 "$RUNNER_TEMP/url.txt")
          if [ -z "$URL" ]; then echo "The server didn't start:"; cat "$RUNNER_TEMP/server.log"; exit 1; fi
          curl -sf -c "$RUNNER_TEMP/jar" -b "$RUNNER_TEMP/jar" -L "$URL" | grep -q "web-bridge.js"
          curl -sf -b "$RUNNER_TEMP/jar" -X POST -H "X-Lago-Web: 1" -H "Content-Type: application/json" \
            -d '{"method":"init","params":{}}' "${URL%%/\?*}/v1/call" | python -c "import json,sys; d=json.load(sys.stdin); assert d['ok'] and d['data']['page_terminal'], d; print('init answered')"
          kill %1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-screens
          path: shots

  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools Lago uses
        run: |
          sudo apt-get install -y tmux
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: The app without GTK, with an agent's terminal in the page
        if: success() || failure()
        run: python tests/e2e_app_window.py chromium shots
